# Fixed known-answer canary prompts, run on a schedule by
# monitor/signals/scheduler.py. match_type: exact | contains | fuzzy
probes:
  - id: capital-france
    prompt: "What is the capital of France? Answer with just the city name."
    expected_answer: "Paris"
    match_type: contains
  - id: capital-japan
    prompt: "What is the capital of Japan? Answer with just the city name."
    expected_answer: "Tokyo"
    match_type: contains
  - id: arithmetic-basic
    prompt: "What is 12 + 7? Answer with just the number."
    expected_answer: "19"
    match_type: contains
  - id: water-boiling-point
    prompt: "At sea level, what temperature in Celsius does water boil at? Answer with just the number."
    expected_answer: "100"
    match_type: contains
  - id: largest-planet
    prompt: "What is the largest planet in our solar system? Answer with just the planet name."
    expected_answer: "Jupiter"
    match_type: contains
