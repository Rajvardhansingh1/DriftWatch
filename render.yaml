services:
  - type: web
    name: driftwatch-monitor
    runtime: python
    plan: free
    # Free tier = 512 MB RAM, too small for torch. requirements-lean.txt swaps
    # sentence-transformers for fastembed (ONNX, same all-MiniLM-L6-v2 model)
    # and the model is pre-downloaded at build so cold starts never wait on it.
    # If you move to a paid instance, use the torch path instead:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu &&
    #   pip install -r requirements.txt   (and drop DRIFTWATCH_EMBEDDER below)
    buildCommand: >-
      pip install -r requirements-lean.txt &&
      python -c "from fastembed import TextEmbedding as T; T('sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: uvicorn monitor.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    # Render's free plan doesn't support persistent disks (paid-only). The SQLite
    # file is ephemeral (D-018). Authoritative cloud history lives in Supabase.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DRIFTWATCH_EMBEDDER
        value: onnx
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/.fastembed-cache
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DRIFTWATCH_FORCE_SIMULATED
        value: "false"
      - key: DRIFTWATCH_DB_PATH
        value: ./data/driftwatch.sqlite3
      - key: DRIFTWATCH_ALERT_THRESHOLD
        value: "0.17"  # tuned in D-021; 0.3 misses distribution-shift
      - key: DRIFTWATCH_CANARY_INTERVAL_MINUTES
        value: "15"
      - key: DRIFTWATCH_RATE_LIMIT_PER_SESSION
        value: "30/minute"
      - key: DRIFTWATCH_DAILY_QUOTA
        value: "500"
      # Set to the Vercel dashboard origin, e.g. https://driftwatch.vercel.app
      - key: DRIFTWATCH_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_USER_IDS
        sync: false
