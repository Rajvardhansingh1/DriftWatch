services:
  - type: web
    name: driftwatch-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn monitor.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Render's free plan doesn't support persistent disks (paid-only) - the
    # SQLite file lives in the container's ephemeral filesystem and resets
    # on redeploy/restart. Acceptable at demo scale (D-018): the service
    # already sleeps after 15 min idle, and canary/embeddings baseline
    # reseed on every cold start regardless.
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DRIFTWATCH_DB_PATH
        value: ./data/driftwatch.sqlite3
      - key: DRIFTWATCH_ALERT_THRESHOLD
        value: "0.3"
      - key: DRIFTWATCH_CANARY_INTERVAL_MINUTES
        value: "15"
      - key: DRIFTWATCH_RATE_LIMIT_PER_SESSION
        value: "30/minute"
      - key: DRIFTWATCH_DAILY_QUOTA
        value: "500"
