services:
  - type: web
    name: driftwatch-monitor
    runtime: python
    plan: free
    # CPU-only torch (the default Linux wheel bundles CUDA, ~2 GB, slow to
    # build and too big for the 512 MB free instance), then pre-download the
    # embedding model at build time so a cold start never waits on Hugging Face.
    buildCommand: >-
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python -c "from sentence_transformers import SentenceTransformer as S; S('all-MiniLM-L6-v2')"
    startCommand: uvicorn monitor.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    # Render's free plan doesn't support persistent disks (paid-only). The SQLite
    # file is ephemeral (D-018). Authoritative cloud history lives in Supabase.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME
        value: /opt/render/project/.hf-cache
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DRIFTWATCH_FORCE_SIMULATED
        value: "false"
      - key: DRIFTWATCH_DB_PATH
        value: ./data/driftwatch.sqlite3
      - key: DRIFTWATCH_ALERT_THRESHOLD
        value: "0.17"  # tuned in D-021; 0.3 misses distribution-shift
      - key: DRIFTWATCH_CANARY_INTERVAL_MINUTES
        value: "15"
      - key: DRIFTWATCH_RATE_LIMIT_PER_SESSION
        value: "30/minute"
      - key: DRIFTWATCH_DAILY_QUOTA
        value: "500"
      # Set to the Vercel dashboard origin, e.g. https://driftwatch.vercel.app
      - key: DRIFTWATCH_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_USER_IDS
        sync: false
