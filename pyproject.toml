[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "driftwatch-llm"
dynamic = ["version"]
description = "Command-line tool for DriftWatch, a drift monitor for LLM apps."
readme = "driftwatch_llm/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
  'tomli>=2; python_version < "3.11"',
]

[project.scripts]
driftwatch = "driftwatch_llm.cli:app"

[tool.hatch.version]
path = "driftwatch_llm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["driftwatch_llm"]

[tool.hatch.build.targets.sdist]
include = ["driftwatch_llm", "pyproject.toml", "LICENSE"]
