name: release-cli

# Publishes driftwatch-llm to PyPI with trusted publishing (OIDC): no API token exists anywhere.
# One-time setup by the owner: a pending trusted publisher on PyPI for project `driftwatch-llm`
# (repo Rajvardhansingh1/DriftWatch, workflow release-cli.yml, environment pypi), and a `pypi`
# environment in the repo settings with a required reviewer. Then push a tag such as cli-v0.1.0.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The tag must match the package version
        if: startsWith(github.ref_name, 'cli-v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' driftwatch_llm/__init__.py)"
          test -n "$version"
          test "cli-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: pip install typer httpx keyring platformdirs pytest pytest-asyncio hatchling build
      # --confcutdir skips tests/conftest.py, which imports the server settings this job does not install
      - run: pytest tests/cli -q --confcutdir=tests/cli
      # The local dashboard page: built from the shared frontend components, shipped inside the wheel.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:local
        working-directory: frontend
      - run: test -f driftwatch_llm/dashboard_static/index.html
      - run: python -m build
      # What a user gets when they install the wheel with the agent extra, as a CycloneDX software bill of materials.
      - run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install -q "$(ls dist/*.whl)[agent]" cyclonedx-bom pip-audit
          /tmp/sbom/bin/cyclonedx-py environment --of JSON -o sbom.cdx.json /tmp/sbom
      # Known vulnerabilities in what the wheel pulls in. Reported, not blocking: an upstream advisory must not stop a fix from
      # shipping, but it is printed here where the owner looks before approving the release.
      - run: /tmp/sbom/bin/pip-audit --path /tmp/sbom/lib/python3.11/site-packages
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  # Signed build provenance (who built these files, from which commit, in which workflow), verifiable with `gh attestation verify`.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # v4.3.0, pinned to a commit so a moved tag cannot change what runs here
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      # v2.4.0, pinned to a commit
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/driftwatch-llm/
    permissions:
      id-token: write # the only job that can mint the OIDC token PyPI trusts
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      # v1.14.2, pinned to a commit so a moved tag cannot change what runs here
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
