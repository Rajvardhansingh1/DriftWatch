name: supabase-keepalive
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase so the free project is never paused for inactivity
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'

  # The alarm for the cloud runner: GitHub disables scheduled workflows after 60 days without repository activity,
  # and a runner that silently stopped would otherwise look like "no drift". This fails (and emails the owner) when a
  # connected model's runs are more than two intervals late. Aggregates only: no ids, no content.
  runner-health:
    if: vars.CLOUD_CONNECT == 'on'
    runs-on: ubuntu-latest
    environment: cloud-runner
    permissions: {}
    steps:
      - name: Check the runner is alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          req = urllib.request.Request(
              os.environ["SUPABASE_URL"] + "/rest/v1/rpc/runner_health",
              data=json.dumps({"p_secret": os.environ["RUNNER_SECRET"]}).encode(),
              headers={"apikey": os.environ["SUPABASE_ANON_KEY"], "content-type": "application/json"},
          )
          health = json.load(urllib.request.urlopen(req, timeout=30))
          print({k: health[k] for k in ("enabled", "models", "stale", "dead", "decrypts_24h", "claims_24h")})
          # a decrypt per claimed job is normal; more decrypts than claims is not
          problems = []
          if health["enabled"] and health["stale"] > 0:
              problems.append("the runner is late: re-enable the scheduled workflow or check the cloud-runner runs")
          if health["decrypts_24h"] > health["claims_24h"]:
              problems.append("more decrypts than claims in 24 hours")
          if problems:
              print("PROBLEM: " + "; ".join(problems))
              sys.exit(1)
          PY
