name: cloud-runner

# The scheduled runner for connected models (Plan 7). It opens users' sealed provider keys, so it is deliberately
# narrow, and it does nothing unless the owner switched it on:
#   - repository variable CLOUD_CONNECT must be "on" (the database has its own, second switch)
#   - the `cloud-runner` environment holds the secrets and must be restricted to the `main` branch (Settings ->
#     Environments -> cloud-runner -> Deployment branches). Pull requests from forks never receive secrets.
# Public repository: workflow logs are public. The runner prints one line per job (a short id, an outcome word and
# counts) and never a probe, an answer, a provider message or a key (tests/test_runner.py enforces it).
#
# GitHub disables scheduled workflows after 60 days without repository activity. The keep-alive workflow checks the
# runner's last run and fails loudly when it is stale (see supabase-keepalive.yml and runner_health()).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloud-runner
  cancel-in-progress: false

jobs:
  run:
    if: vars.CLOUD_CONNECT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloud-runner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir -r requirements-runner.txt
      # The embedding model (about 90 MB) is cached between runs.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .fastembed-cache
          key: fastembed-minilm-l6-v2-v1
      - name: Run the due jobs
        run: python -m monitor.cloud.runner
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          RUNNER_PRIVATE_KEY: ${{ secrets.RUNNER_PRIVATE_KEY }}
