name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Never spend real provider quota in CI (D-035).
      DRIFTWATCH_FORCE_SIMULATED: "true"
      GROQ_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # The local agent uses OS-specific pieces (named pipes / unix sockets, file locks, process spawning), so its tests
  # run on all three systems. macOS runs only on pushes to main (it is the slowest runner).
  agent-tests:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    env:
      DRIFTWATCH_FORCE_SIMULATED: "true"
      DRIFTWATCH_AGENT_EMBEDDER: hash
      GROQ_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # No torch here: the agent tests use fake embedders, so the light set is enough and fast on every system.
      - run: pip install pytest pytest-asyncio numpy httpx typer keyring platformdirs pyyaml hatchling build fastapi pydantic pydantic-settings sqlalchemy apscheduler slowapi groq google-generativeai python-dotenv "pyjwt[crypto]" anyio
      - run: python -m pytest tests/agent tests/capture tests/core tests/cli tests/test_agent_testkit.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required: @supabase/realtime-js needs a native WebSocket.
          # Matches the Node 24 used on Vercel and locally.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Node seals, Python opens: the live cross-language check of the sealed-key format (needs node_modules, so it runs here)
      - run: pip install cryptography pytest
        working-directory: .
      - run: python -m pytest tests/test_seal.py -q -p no:cacheprovider --confcutdir=tests/fixtures
        working-directory: .
      - run: npx tsc --noEmit
      # high and critical advisories fail the build unless deploy/audit-exceptions.json accepts them (with a reason and an expiry)
      - run: node scripts/audit-check.mjs
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_MONITOR_API_URL: http://localhost:8000
      # The local dashboard (shipped inside the CLI package) must keep building from the shared components.
      - run: npm run build:local

  # The SQL is where the security lives (row-level security, definer functions, quotas, leases). These run the real
  # migrations on an embedded Postgres with a Supabase-like shim: the SQL tests, the concurrency checks, the runner
  # end to end, and the rehearsals of the incident runbooks and kill switches. Any FAIL line fails the job.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pgserver psycopg2-binary cryptography httpx numpy
      - run: python scripts/run_sql_tests_local.py
      - run: python scripts/test_quota_concurrency_local.py
      - run: python scripts/test_runner_concurrency_local.py
      - run: python scripts/test_runner_e2e_local.py
      - run: python scripts/test_runbook_local.py
      - run: python scripts/test_switches_local.py

  # The cloud runner opens users' provider keys: its pinned dependencies are checked against known vulnerabilities.
  audit-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-runner.txt
      # What Render runs (the lean set; the full requirements.txt adds torch and is development-only). Audited as an
      # installed environment, because the dependency resolver inside pip-audit cannot solve this set on its own.
      - run: python -m venv /tmp/lean && /tmp/lean/bin/python -m pip install -q --upgrade pip setuptools && /tmp/lean/bin/python -m pip install -q -r requirements-lean.txt
      - run: pip-audit --path /tmp/lean/lib/python3.11/site-packages

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action auto-detects `gitleaks.toml` (no dot), not `.gitleaks.toml`: name the file.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Same version as the local check; the allowlist syntax needs 8.25 or newer.
          GITLEAKS_VERSION: "8.30.1"
          # The job is read-only, so posting PR comments only adds errors. Findings still fail the job.
          GITLEAKS_ENABLE_COMMENTS: "false"
